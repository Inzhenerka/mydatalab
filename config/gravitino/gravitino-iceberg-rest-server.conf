server:
  type: simple
  applicationContextPath: /
  adminContextPath: /admin
  connector:
    type: http
    port: ${ICEBERG_REST_PORT}

catalog:
  catalog-impl: org.apache.iceberg.jdbc.JdbcCatalog
  catalog-name: ${ICEBERG_CATALOG_NAME}
  warehouse: ${ICEBERG_WAREHOUSE}
  uri: ${ICEBERG_JDBC_URI}
  io-impl: org.apache.iceberg.aws.s3.S3FileIO
  s3.endpoint: ${ICEBERG_MINIO_ENDPOINT}
  s3.path-style-access: true
  s3.access-key-id: ${MINIO_ROOT_USER}
  s3.secret-access-key: ${MINIO_ROOT_PASSWORD}
  s3.region: ${ICEBERG_AWS_REGION}
