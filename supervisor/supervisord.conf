[unix_http_server]
file=%(ENV_SUPERVISOR_RUN_DIR)s/supervisor.sock
chmod=0700

[inet_http_server]
port=%(ENV_SUPERVISOR_HTTP_ADDRESS)s
username=%(ENV_SUPERVISOR_HTTP_USER)s
password=%(ENV_SUPERVISOR_HTTP_PASSWORD)s

[supervisord]
logfile=%(ENV_SUPERVISOR_LOG_DIR)s/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=%(ENV_SUPERVISOR_RUN_DIR)s/supervisord.pid
childlogdir=%(ENV_SUPERVISOR_LOG_DIR)s
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_SUPERVISOR_RUN_DIR)s/supervisor.sock

[group:mydatalab]
programs=minio,gravitino,static-site,notebook

[program:minio]
command=/usr/local/bin/start-minio.sh --foreground
priority=20
user=jovyan
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true

[program:gravitino]
command=/usr/local/bin/start-gravitino.sh --foreground
priority=25
user=jovyan
autostart=true
autorestart=true
startsecs=15
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true

[program:static-site]
command=/usr/local/bin/start-static-site.sh --foreground
priority=30
user=jovyan
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true

[program:notebook]
command=%(ENV_MYDATALAB_NOTEBOOK_COMMAND)s
priority=40
user=jovyan
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
